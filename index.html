<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Папуга 3D: Втеча від Господаря</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }

        /* Інтерфейс поверх гри */
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 25px;
            border-radius: 30px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            border: 2px solid #4cd137;
        }

        #status {
            color: #4cd137;
        }

        /* Екран програшу */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .btn {
            background: #4cd137;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.3rem;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(76, 209, 55, 0.4);
        }
        .btn:hover { background: #44bd32; }

        /* Підказка щодо керування */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.9rem;
            pointer-events: none;
        }
    </style>
    <!-- Підключаємо 3D движок Three.js -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

    <div id="ui">
        <div>🥜 Горішки: <span id="score">0</span></div>
        <div>Статус: <span id="status">Воля! 😎</span></div>
    </div>

    <div id="overlay">
        <h2>Тебе зловили! 😭</h2>
        <p>Господар перехитрив тебе і повернув у клітку.</p>
        <button class="btn" onclick="resetGame()">Злетіти знову 🔄</button>
    </div>

    <div id="instructions">
        ⌨️ Керування: <b>Стрілочки</b> або <b>W, A, S, D</b> (рух птаха у 3D просторі)
    </div>

    <script>
        let scene, camera, renderer;
        let parrot, human, nut;
        let score = 0;
        let isGameOver = false;

        // Межі 3D кімнати
        const ROOM_WIDTH = 30;
        const ROOM_DEPTH = 30;
        const ROOM_HEIGHT = 15;

        // Клавіші керування
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

        function init() {
            // 1. Створення 3D Сцени
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1e272e);

            // 2. Камера
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            // 3. Рендерер (візуалізатор)
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 4. Освітлення
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 5. Створення кімнати (Підлога та Стіни)
            const floorGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_DEPTH);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0xfbc531 }); // Жовта підлога
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Задня стіна для об'єму
            const wallGeo = new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_HEIGHT);
            const wallMat = new THREE.MeshLambertMaterial({ color: 0x487eb0 });
            const backWall = new THREE.Mesh(wallGeo, wallMat);
            backWall.position.set(0, ROOM_HEIGHT/2, -ROOM_DEPTH/2);
            scene.add(backWall);

            // 6. Створення гравця — 3D ПАПУГА 🦜
            parrot = new THREE.Group();
            // Тіло папуги
            const bodyGeo = new THREE.CylinderGeometry(0.5, 0.5, 1.5, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0xff4757 }); // Червоний ара
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.rotation.x = Math.PI / 3; // Нахил при польоті
            parrot.add(body);
            // Дзьоб
            const beakGeo = new THREE.ConeGeometry(0.2, 0.5, 4);
            const beakMat = new THREE.MeshStandardMaterial({ color: 0xeccc68 }); // Жовтий дзьоб
            const beak = new THREE.Mesh(beakGeo, beakMat);
            beak.position.set(0, 0.5, 0.6);
            beak.rotation.x = Math.PI / 2;
            parrot.add(beak);
            
            parrot.position.set(0, 3, 5); // Початкова висота польоту
            scene.add(parrot);

            // 7. Створення ГОСПОДАРЯ 🧍‍♂️ (Циліндр + Голова)
            human = new THREE.Group();
            const bodyHuman = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.6, 2.5, 16), new THREE.MeshStandardMaterial({ color: 0x2e86de }));
            bodyHuman.position.y = 1.25;
            const headHuman = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffddaa }));
            headHuman.position.y = 2.7;
            human.add(bodyHuman, headHuman);
            human.position.set(8, 0, -5);
            scene.add(human);

            // 8. Створення ГОРІШКА 🥜 (Золота сфера)
            const nutGeo = new THREE.SphereGeometry(0.3, 16, 16);
            const nutMat = new THREE.MeshStandardMaterial({ color: 0xffa500, roughness: 0.1 });
            nut = new THREE.Mesh(nutGeo, nutMat);
            spawnNut();
            scene.add(nut);

            // Створення меблів (3D Куби)
            createFurniture(4, 5, 4, -8, 2, -8, 0x8b5a2b); // Шафа
            createFurniture(6, 2, 3, 7, 1, 6, 0xcd6133);  // Диван

            // Слухачі клавіатури
            window.addEventListener('keydown', e => { if(e.key in keys || e.code in keys) keys[e.key] = true; });
            window.addEventListener('keyup', e => { if(e.key in keys || e.code in keys) keys[e.key] = false; });
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function createFurniture(w, h, d, x, y, z, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        function spawnNut() {
            nut.position.x = (Math.random() - 0.5) * (ROOM_WIDTH - 4);
            nut.position.z = (Math.random() - 0.5) * (ROOM_DEPTH - 4);
            nut.position.y = Math.random() * 5 + 1; // Горіхи літають у повітрі
        }

        function handleInput() {
            const pSpeed = 0.2;
            if (keys.w || keys.ArrowUp) parrot.position.z -= pSpeed;
            if (keys.s || keys.ArrowDown) parrot.position.z += pSpeed;
            if (keys.a || keys.ArrowLeft) parrot.position.x -= pSpeed;
            if (keys.d || keys.ArrowRight) parrot.position.x += pSpeed;

            // Обмеження польоту стінами кімнати
            parrot.position.x = Math.max(-ROOM_WIDTH/2 + 1, Math.min(ROOM_WIDTH/2 - 1, parrot.position.x));
            parrot.position.z = Math.max(-ROOM_DEPTH/2 + 1, Math.min(ROOM_DEPTH/2 - 1, parrot.position.z));
        }

        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            handleInput();

            // 1. Рух Господаря (Штучний інтелект)
            let dx = parrot.position.x - human.position.x;
            let dz = parrot.position.z - human.position.z;
            let distance = Math.hypot(dx, dz);

            if (distance < 10) { // Господар побачив папугу
                document.getElementById('status').innerText = "🚨 ТІКАЙ! ВІН БІЖИТЬ! 🚨";
                document.getElementById('status').style.color = '#ff4757';
                // Біжить до папуги
                human.position.x += (dx / distance) * 0.08;
                human.position.z += (dz / distance) * 0.08;
            } else {
                document.getElementById('status').innerText = "Воля! 😎";
                document.getElementById('status').style.color = '#4cd137';
                // Ходить кругами
                human.position.x += Math.sin(Date.now() * 0.001) * 0.03;
            }

            // 2. Анімація обертання горішка
            nut.rotation.y += 0.05;

            // 3. Динамічна камера (літає ззаду папуги)
            camera.position.set(parrot.position.x, parrot.position.y + 6, parrot.position.z + 10);
            camera.lookAt(parrot.position);

            // 4. Перевірка зіткнення з горішком
            if (parrot.position.distanceTo(nut.position) < 1.2) {
                score++;
                document.getElementById('score').innerText = score;
