<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Симулятор Папуги: Втеча від Господаря</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #222;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #gameUi {
            display: flex;
            gap: 20px;
            margin-bottom: 10px;
            font-size: 1.1rem;
            background: rgba(0,0,0,0.4);
            padding: 8px 20px;
            border-radius: 20px;
        }

        /* Ігрова кімната */
        #room {
            position: relative;
            width: 600px;
            height: 400px;
            background: #fbc531; /* Колір шпалер в хаті */
            border: 15px solid #7f8fa6; /* Плінтуси/Стіни */
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Меблі в хаті */
        .furniture {
            position: absolute;
            background: #cd6133;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            color: rgba(255,255,255,0.7);
        }

        /* Персонажі та предмети */
        .game-obj {
            position: absolute;
            font-size: 35px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        #parrot {
            z-index: 10;
        }

        #human {
            z-index: 5;
            font-size: 45px;
        }

        #nut {
            font-size: 25px;
        }

        /* Екран програшу/виграшу */
        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 100;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
        }

        .btn {
            background: #4cd137;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
        }
        
        .btn:hover { background: #44bd32; }

        /* Мобільне керування */
        #controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            grid-gap: 5px;
            margin-top: 15px;
        }
        .ctrl-btn {
            width: 50px; height: 50px;
            background: #333; border: 2px solid #555;
            color: white; font-size: 1.5rem;
            border-radius: 10px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .ctrl-btn:active { background: #555; }
    </style>
</head>
<body>

    <h1>Симулятор Папуги 🦜</h1>
    <div id="gameUi">
        <div>З'їдено горішків: <span id="score">0</span></div>
        <div>Статус: <span id="status">Літаєш на волі! 😎</span></div>
    </div>

    <div id="room">
        <!-- Меблі -->
        <div class="furniture" style="width: 100px; height: 120px; bottom: 0; left: 50px;">Шафа 🚪</div>
        <div class="furniture" style="width: 130px; height: 60px; bottom: 0; right: 80px;">Диван 🛋️</div>
        <div class="furniture" style="width: 80px; height: 50px; top: 100px; left: 250px; background: #9c88ff;">Стіл 🍽️</div>

        <!-- Об'єкти -->
        <div id="parrot" class="game-obj">🦜</div>
        <div id="human" class="game-obj">🧍‍♂️</div>
        <div id="nut" class="game-obj">🥜</div>

        <!-- Оверлей стану гри -->
        <div id="overlay">
            <h2 id="overText">Тебе зловили! 😭</h2>
            <p>Господар посадив тебе назад у клітку.</p>
            <button class="btn" onclick="resetGame()">Спробувати знову 🔄</button>
        </div>
    </div>

    <!-- Кнопки для телефонів -->
    <div id="controls">
        <div></div><button class="ctrl-btn" onclick="move('up')">▲</button><div></div>
        <button class="ctrl-btn" onclick="move('left')">◀</button><div></div><button class="ctrl-btn" onclick="move('right')">▶</button>
        <div></div><button class="ctrl-btn" onclick="move('down')">▼</button><div></div>
    </div>

    <script>
        // Координати та налаштування
        const room = document.getElementById('room');
        const parrot = document.getElementById('parrot');
        const human = document.getElementById('human');
        const nut = document.getElementById('nut');
        const overlay = document.getElementById('overlay');

        let pX = 40, pY = 40;     // Позиція папуги
        let hX = 400, hY = 250;   // Позиція господаря
        let nX = 200, nY = 150;   // Позиція горішка
        
        let score = 0;
        let isGameOver = false;
        const speed = 15; // Швидкість руху папуги

        function initPositions() {
            parrot.style.left = pX + 'px';
            parrot.style.top = pY + 'px';
            human.style.left = hX + 'px';
            human.style.top = hY + 'px';
            nut.style.left = nX + 'px';
            nut.style.top = nY + 'px';
        }

        // Керування клавіатурою
        document.addEventListener('keydown', (e) => {
            if (isGameOver) return;
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') move('up');
            if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') move('down');
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') move('left');
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') move('right');
        });

        function move(dir) {
            if (isGameOver) return;
            
            if (dir === 'up' && pY > 10) pY -= speed;
            if (dir === 'down' && pY < 350) pY += speed;
            if (dir === 'left') { pX -= speed; parrot.style.transform = 'scaleX(1)'; }
            if (dir === 'right') { pX += speed; parrot.style.transform = 'scaleX(-1)'; } // Поворот птаха

            // Обмеження екрану
            pX = Math.max(10, Math.min(550, pX));
            pY = Math.max(10, Math.min(350, pY));

            parrot.style.left = pX + 'px';
            parrot.style.top = pY + 'px';

            checkCollisions();
        }

        // Штучний інтелект господаря (рухається за папугою, якщо той близько)
        setInterval(() => {
            if (isGameOver) return;

            // Рахуємо відстань до папуги
            let dist = Math.hypot(pX - hX, pY - hY);

            if (dist < 180) {
                // Маніакальне переслідування, якщо господар помітив птаха!
                document.getElementById('status').innerText = "🚨 Господар помітив тебе! ТІКАЙ! 🚨";
                document.getElementById('status').style.color = '#ff4757';
                
                if (hX < pX) hX += 8; else hX -= 8;
                if (hY < pY) hY += 8; else hY -= 8;
            } else {
                // Звичайне ліниве патрулювання кімнати
                document.getElementById('status').innerText = "Літаєш на волі! 😎";
                document.getElementById('status').style.color = '#fff';
                hX += (Math.random() - 0.5) * 15;
                hY += (Math.random() - 0.5) * 15;
            }

            // Кордони для господаря (він ходить тільки по підлозі)
            hX = Math.max(20, Math.min(540, hX));
            hY = Math.max(150, Math.min(340, hY));

            human.style.left = hX + 'px';
            human.style.top = hY + 'px';

            checkCollisions();
        }, 100);

        function checkCollisions() {
            // 1. Перевірка: чи з'їв горіх
            if (Math.hypot(pX - nX, pY - nY) < 30) {
                score++;
                document.getElementById('score').innerText = score;
                // Спавн горіха в новому місці
                nX = Math.random() * 500 + 30;
                nY = Math.random() * 300 + 30;
                nut.style.left = nX + 'px';
                nut.style.top = nY + 'px';
            }

            // 2. Перевірка: чи зловив господар
            if (Math.hypot(pX - hX, pY - hY) < 35) {
                isGameOver = true;
                overlay.style.display = 'flex';
            }
        }

        function resetGame() {
            pX = 40; pY = 40;
            hX = 400; hY = 250;
            score = 0;
            isGameOver = false;
            document.getElementById('score').innerText = score;
            overlay.style.display = 'none';
            initPositions();
        }

        // Запуск
        initPositions();
    </script>
</body>
</html>
